<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangent Study</title>
<meta name="description" content="Tangent Study: decí un tema en voz alta y entendelo fácil, en español y en inglés.">
<meta name="robots" content="noindex, noai, noimageai">
<meta name="theme-color" content="#ECECEC">
<link rel="icon" href="/assets/logo-skater.png">
<link rel="apple-touch-icon" href="/assets/logo-skater.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter+Tight:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/assets/study.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
</defs></svg>
<div id="shell">
  <header id="top">
    <a href="#inicio" class="brand"><img src="/assets/logo-skater.png" alt="" width="34" height="38"><span>Tangent</span></a>
    <div class="topr">
      <a id="me" href="#cuenta" class="me" aria-label="Mi personaje / My character"></a>
      <button id="readBtn" class="pill" type="button" aria-label="Lectura fácil / Easy reading"><span aria-hidden="true">Aa</span></button>
      <button id="langBtn" class="pill" type="button" aria-label="Idioma / Language">EN</button>
    </div>
  </header>
  <nav id="side" aria-label="Menú"></nav>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="Menú rápido"></nav>
</div>
<div id="print" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/assets/study.js" defer></script>
</body>
</html>

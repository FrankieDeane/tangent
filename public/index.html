<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tangent · Say it messy. See it clear.</title>
<meta name="description" content="Tangent: grabá tu idea como sale y recibí una imagen clara de lo que querés decir. Experimental.">
<meta name="robots" content="noai, noimageai">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="Tangent"><img src="/assets/logo.png" alt="Tangent" width="352" height="299"></a>
    <span class="tagline" data-t="tagline"></span>
    <div class="top-r">
      <span class="pill" data-t="experimental"></span>
      <button class="lang" id="langBtn" aria-label="Language">EN</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen" id="home">
      <div class="hero">
        <div class="hero-top"><span data-t="heroL"></span><span>ES · EN</span></div>
        <h1 class="wordmark">TANGENT<span>.1</span></h1>
        <div class="hero-bot">
          <p class="lead"><span data-t="lead1"></span><br><em data-t="lead2"></em></p>
          <p class="sub" data-t="sub"></p>
        </div>
      </div>
      <div class="recarea">
      <button class="rec" id="recBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>
        <span data-t="record"></span>
      </button>
      <div class="row-links">
        <button class="textlink" id="typeLink" data-t="type"></button>
        <span aria-hidden="true">·</span>
        <button class="textlink" id="exampleLink" data-t="example"></button>
      </div>
      <div class="typebox" id="typeBox" hidden>
        <label for="typed" class="sr" data-t="type"></label>
        <textarea id="typed" maxlength="4000"></textarea>
        <button class="btn" id="typedGo" data-t="showme"></button>
      </div>
      <p class="small" id="homeNote" role="status"></p>
      </div>
      <div class="rows">
        <div class="rowi"><small>01</small><b data-t="r1"></b><span data-t="r1s"></span></div>
        <div class="rowi"><small>02</small><b data-t="r2"></b><span data-t="r2s"></span></div>
        <div class="rowi"><small>03</small><b data-t="r3"></b><span data-t="r3s"></span></div>
      </div>
      <div class="stats">
        <div><b>60s</b><span data-t="st1"></span></div>
        <div><b>1</b><span data-t="st2"></span></div>
        <div><b>0</b><span data-t="st3"></span></div>
      </div>
      <section class="garden" id="garden" hidden>
        <h2 data-t="garden"></h2>
        <div class="seeds" id="seeds"></div>
      </section>
    </section>

    <!-- RECORDING -->
    <section class="screen" id="recording" hidden>
      <canvas id="live" width="600" height="200" aria-hidden="true"></canvas>
      <div class="time" id="clock">0:00</div>
      <p class="small" data-t="listening"></p>
      <button class="btn" id="stopBtn" data-t="done"></button>
      <button class="textlink" id="cancelBtn" data-t="cancel"></button>
    </section>

    <!-- THINKING -->
    <section class="screen" id="thinking" hidden>
      <div class="field" id="field" aria-hidden="true"></div>
      <p class="caption" id="thinkCap"></p>
    </section>

    <!-- BOARD -->
    <section class="screen" id="board" hidden></section>
  </main>

  <footer class="foot">
    <p data-t="footwarn"></p>
    <nav><a href="/terms.html" data-t="terms"></a><a href="/privacy.html" data-t="privacy"></a></nav>
    <p>© <span id="year"></span> Tangent. <span data-t="rights"></span></p>
  </footer>
</div>

<!-- Modal (consent, warnings, support, errors) -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbox">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="mrow" id="mBtns"></div>
  </div>
</div>

<script src="/assets/scenes.js"></script>
<script src="/assets/sounds.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>

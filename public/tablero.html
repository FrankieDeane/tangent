<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tangent · Say it messy. See it clear.</title>
<meta name="description" content="Tangent: grabá tu idea como sale y recibí una imagen clara de lo que querés decir. Experimental.">
<meta name="robots" content="noai, noimageai">
<meta name="theme-color" content="#ECECEC">
<link rel="icon" href="/assets/favicon.png">
<meta property="og:image" content="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="Tangent"><img src="/assets/mark@3x.webp" alt="" width="332" height="240" decoding="async" fetchpriority="high"><span>Tangent</span></a>
    <span class="tagline" data-t="tagline"></span>
    <div class="top-r">
      <span class="pill" data-t="experimental"></span>
      <div class="lang" id="langSw" role="group" aria-label="Idioma / Language"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
      <button class="acct" id="acctBtn"></button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="screen" id="home">
      <div class="hero">
        <h1 class="lead"><span data-t="lead1"></span><br><em data-t="lead2"></em></h1>
        <div class="hero-r">
          <span class="label" data-t="heroL"></span>
          <p class="sub"><span data-t="sub"></span> <b data-t="sub2"></b></p>
        </div>
      </div>
      <div class="resume" id="resume" hidden></div>
      <div class="recarea">
      <svg class="wires" viewBox="0 0 1000 340" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#8f8f8f" stroke-linecap="round"><path d="M-20 120 C 240 60, 520 260, 1020 70" stroke-width="2.2" opacity=".55"/><path d="M-20 150 C 260 100, 560 290, 1020 110" stroke-width="1.4" opacity=".35"/><path d="M-20 300 C 300 250, 700 330, 1020 200" stroke-width="2" opacity=".45"/></g></svg>
      <button class="rec" id="recBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>
        <span data-t="record"></span>
      </button>
      <div class="row-links">
        <button class="textlink" id="typeLink" data-t="type"></button>
        <span aria-hidden="true">·</span>
        <button class="textlink" id="exampleLink" data-t="example"></button>
      </div>
      <div class="typebox" id="typeBox" hidden>
        <label for="typed" class="sr" data-t="type"></label>
        <textarea id="typed" maxlength="4000"></textarea>
        <button class="btn" id="typedGo" data-t="showme"></button>
      </div>
      <p class="small" id="homeNote" role="status"></p>
      </div>
      <div class="rows">
        <div class="rowi reveal tilt"><small>01</small><b data-t="r1"></b><span data-t="r1s"></span></div>
        <div class="rowi reveal tilt"><small>02</small><b data-t="r2"></b><span data-t="r2s"></span></div>
        <div class="rowi reveal tilt"><small>03</small><b data-t="r3"></b><span data-t="r3s"></span></div>
      </div>
      <div class="stats">
        <div class="reveal"><b data-n="2" data-suf=" min">2 min</b><span data-t="st1"></span></div>
        <div class="reveal"><b data-n="1">1</b><span data-t="st2"></span></div>
        <div class="reveal"><b data-n="0">0</b><span data-t="st3"></span></div>
      </div>
      <section class="sparkbox reveal" id="sparkBox">
        <div class="sb-l">
          <span class="plabel">✦ <span data-t="sparkT"></span></span>
          <h2 data-t="sparkHome"></h2>
          <p id="sparkNote"></p>
        </div>
        <div class="sb-r">
          <button class="btn" id="sparkG" data-t="sparkGarden"></button>
          <button class="btn ghost" id="sparkI" data-t="sparkImages"></button>
          <input type="file" id="sparkFile" accept="image/*" multiple hidden>
        </div>
      </section>
      <section class="parkedbox" id="parkedBox" hidden></section>
      <section class="garden" id="garden" hidden>
        <h2 data-t="garden"></h2>
        <div class="seeds" id="seeds"></div>
      </section>
    </section>

    <!-- RECORDING -->
    <section class="screen" id="recording" hidden>
      <div class="ink" id="ink" aria-hidden="true"></div>
      <canvas id="live" width="600" height="200" aria-hidden="true"></canvas>
      <div class="time" id="clock">0:00</div>
      <p class="small" data-t="listening"></p>
      <button class="btn" id="stopBtn" data-t="done"></button>
      <button class="textlink" id="cancelBtn" data-t="cancel"></button>
    </section>

    <!-- THINKING -->
    <section class="screen" id="thinking" hidden>
      <div class="field" id="field" aria-hidden="true"></div>
      <p class="caption" id="thinkCap"></p>
    </section>

    <!-- BOARD -->
    <section class="screen" id="board" hidden></section>
  </main>

  <footer class="foot">
    <p data-t="footwarn"></p>
    <nav><a href="/terms.html" data-t="terms"></a><a href="/privacy.html" data-t="privacy"></a></nav>
    <p>© <span id="year"></span> Tangent. <span data-t="rights"></span></p>
  </footer>
</div>

<!-- Modal (consent, warnings, support, errors) -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbox">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="mrow" id="mBtns"></div>
  </div>
</div>

<!-- Account (optional) -->
<div class="amodal" id="acct" hidden role="dialog" aria-modal="true">
  <div class="abox"><button class="aclose" aria-label="Close">×</button><div class="aorb" aria-hidden="true"></div><div class="abody"></div></div>
</div>

<div class="glow" aria-hidden="true"></div>
<script src="/assets/vendor/supabase.js"></script>
<script src="/assets/scenes.js"></script>
<script src="/assets/sounds.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
